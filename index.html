
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Old School Jams</title>
    </head>
    <body>
        <h1>R&B/Soul Album Collection</h1>
        <p>Welcome to my collection of classic R&B and Soul albums. Here you can review albums by various artists.</p>
        <h2>Jump to:</h2>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="{{ url_for('artists') }}">Artists</a></li>
            <li><a href="{{ url_for('albums') }}">Albums</a></li>
        </ul>
        <br>
        <h3>Sign In</h3>
        <form action="{{url_for('index')}}" method="post">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <br>
            <input type="submit">
        </form>
        {%if error_message %}
            <p>{{ error_message }}</p>
        {% endif %}
        <h4>Don't have an account yet?<a href="{{ url_for('register')}}">Sign Up Here!</a></h4>
    </body>
</html>
