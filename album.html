<!DOCTYPE html>
<html>
    <head><meta charset="UTF-8">

    </head>
    <body>
        <p><a href="/">Back to home</a></p>
        <ul>
            <li>Title: {{album_list["title"]}}</li>
            <li>Artist: {{album_list["artist"]}}</li>
            <li>Release Year: {{album_list["year"]}}</li>
        </ul>
        <form method="post" action="{{ url_for('artist_page', id=album_list['id']) }}">
            <label for="rating">Rating:</label>
            <select name="rating" id="rating">
                <option value="one">One Star</option>
                <option value="two">Two Stars</option>
                <option value="three">Three Stars</option>
                <option value="four">Four Stars</option>
                <option value="five">Five Stars</option>
            </select>
            <label for="review">Review:</label>
            <textarea name="review" id="review" rows="3" cols="35"></textarea>
            <button type="submit">Submit</button>
        </form>
    </body>
</html>
